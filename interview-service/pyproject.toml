[tool.poetry]
name = "src"
version = "0.0.1"
description = ""
authors = ["Aliaksandr Fedaraka <fedorakooo@gmain.com>"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["websocket"], version = "^0.116.1"}
uvicorn = {extras = ["standard"], version = "^0.35.0"}
redis = "^6.2.0"
pydantic-settings = "^2.10.1"
pydantic-ai-slim = {version = "^2.64.0", extras = ["openai"]}
websockets = "^15.0.1"
motor = "^3.7.1"
httpx = "^0.28.1"
aio-pika = "^9.5.7"
pyyaml = "^6.0.2"
jwt-handler = { path = "../libs/jwt_handler", develop = true }
shared-models = { path = "../libs/shared_models", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-asyncio = "^1.2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
